name: release

on:
  push:
    tags:
      - "v*.*.*"

env:
  RELEASE_GO_VERSION: "1.26.6"

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.RELEASE_GO_VERSION }}
          cache: false
      - name: Require a tag on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin \
            "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          test "$(git cat-file -t "$TAG")" = tag
          git merge-base --is-ancestor "$TAG^{}" "origin/$DEFAULT_BRANCH"
      - name: Test release source
        run: |
          go test ./...
          go vet ./...
      - name: Build and verify release artifacts
        run: |
          isolated="$(mktemp -d)"
          mkdir -p \
            "$isolated/source" \
            "$isolated/home" \
            "$isolated/tmp" \
            "$isolated/gocache" \
            "$isolated/gomodcache" \
            "$isolated/gopath"
          git archive "$GITHUB_REF_NAME^{}" | tar -xf - -C "$isolated/source"

          go run ./scripts/release --version "$GITHUB_REF_NAME" --output dist
          (
            cd "$isolated/source"
            HOME="$isolated/home" \
            TMPDIR="$isolated/tmp" \
            GOCACHE="$isolated/gocache" \
            GOMODCACHE="$isolated/gomodcache" \
            GOPATH="$isolated/gopath" \
            GOTELEMETRY=off \
              go run ./scripts/release \
                --version "$GITHUB_REF_NAME" \
                --output "$isolated/dist-rebuild"
          )
          cmp dist/checksums.txt "$isolated/dist-rebuild/checksums.txt"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 1
          fi

          cleanup() {
            status=$?
            trap - EXIT INT TERM
            if [ "$status" -ne 0 ]; then
              is_draft="$(
                gh release view "$TAG" --json isDraft \
                  --jq '.isDraft' 2>/dev/null || true
              )"
              if [ "$is_draft" = true ]; then
                gh release delete "$TAG" --yes || true
              fi
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          tag_commit="$(git rev-parse "$TAG^{}")"
          {
            cat .github/release-notes.md
            printf '\n## Build identity\n\n'
            printf -- '- Tag commit: `%s`\n' "$tag_commit"
            printf -- '- Release toolchain: `Go %s`\n' "$RELEASE_GO_VERSION"
            printf '\n## SHA-256 checksums\n\n```text\n'
            cat dist/checksums.txt
            printf '```\n'
          } > release-notes.generated.md

          create_args=(
            --draft
            --verify-tag
            --title "Runprint $TAG"
            --notes-file release-notes.generated.md
          )
          if [[ "$TAG" == *-* ]]; then
            create_args+=(--prerelease)
          fi
          gh release create "$TAG" "${create_args[@]}"
          gh release upload "$TAG" dist/*

          for asset in dist/*; do
            basename "$asset"
          done | LC_ALL=C sort > expected-assets.txt
          gh release view "$TAG" --json assets \
            --jq '.assets[] | select(.state=="uploaded") | .name' |
            LC_ALL=C sort > actual-assets.txt
          diff -u expected-assets.txt actual-assets.txt

          verify_dir="$(mktemp -d)"
          gh release download "$TAG" --dir "$verify_dir"
          cmp dist/checksums.txt "$verify_dir/checksums.txt"
          (
            cd "$verify_dir"
            sha256sum -c checksums.txt
          )

          edit_args=(--draft=false)
          if [[ "$TAG" != *-* ]]; then
            edit_args+=(--latest)
          fi
          gh release edit "$TAG" "${edit_args[@]}"
